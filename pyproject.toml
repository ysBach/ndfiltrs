[build-system]
requires = ["maturin>=1.9.3,<2"]
build-backend = "maturin"

[project]
name = "ndfiltrs"
version = "0.1.0"
description = "Fast NaN-aware N-dimensional filters for NumPy, implemented in Rust"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
keywords = ["numpy", "filtering", "image-processing", "statistics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Repository = "https://github.com/ysBach/ndfiltrs"
Issues = "https://github.com/ysBach/ndfiltrs/issues"
Documentation = "https://ysbach.github.io/ndfiltrs/"
Changelog = "https://github.com/ysBach/ndfiltrs/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=7", "hypothesis>=6", "scipy>=1.10"]
dev = [
    "pytest>=7",
    "hypothesis>=6",
    "scipy>=1.10",
    "ruff",
    "maturin>=1.9.3,<2",
]
bench = ["psutil>=5"]

[tool.maturin]
bindings = "pyo3"
python-source = "python"
module-name = "ndfiltrs._core"
profile = "release"
features = ["extension-module"]
locked = true
exclude = [
    "**/.DS_Store",
    "**/__pycache__/*",
    "**/*.pyc",
    "**/*.so",
    "benchmarks/results/**",
    "dist/**",
    "target/**",
]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = [".venv", "target"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY"]

[tool.ruff.lint.isort]
known-first-party = ["benchmarks", "tests"]
known-third-party = ["ndfiltrs"]

[tool.isort]
known_first_party = ["benchmarks", "tests"]
known_third_party = ["ndfiltrs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
