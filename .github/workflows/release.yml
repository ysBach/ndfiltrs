name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify release identity
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: >-
          python scripts/check_release.py --require-clean --tag "$RELEASE_TAG"
          --github-output "$GITHUB_OUTPUT" --notes-output release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  checks:
    needs: verify
    uses: ./.github/workflows/ci.yml

  wheels:
    needs: verify
    name: Wheel (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            runner: ubuntu-22.04
            target: x86_64
            manylinux: "2_28"
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64
            manylinux: "2_28"
          - name: macos-x86_64
            runner: macos-15-intel
            target: x86_64
            manylinux: "off"
          - name: macos-aarch64
            runner: macos-15
            target: aarch64
            manylinux: "off"
          - name: windows-x86_64
            runner: windows-2022
            target: x64
            manylinux: "off"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Build release wheel without test hooks
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          target: ${{ matrix.platform.target }}
          args: --release --locked --compatibility pypi --out dist
          manylinux: ${{ matrix.platform.manylinux }}
          maturin-version: v1.15.0
          rust-toolchain: "1.84"
      - name: Verify bundled licenses
        run: >-
          python scripts/verify_artifact_licenses.py
          --license LICENSE --notices python/ndfiltrs/licenses --wheel dist
      - name: Test installed wheel on Python 3.10
        run: |
          python -m venv "$RUNNER_TEMP/wheel-py310"
          if [ "$RUNNER_OS" = "Windows" ]; then
            source "$RUNNER_TEMP/wheel-py310/Scripts/activate"
          else
            source "$RUNNER_TEMP/wheel-py310/bin/activate"
          fi
          for wheel in dist/*.whl; do
            uv pip install --python "$VIRTUAL_ENV" "${wheel}[test]"
          done
          python -I scripts/smoke_install.py
          python -m pytest -q
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Smoke test the same wheel on Python 3.13
        run: |
          python -m venv "$RUNNER_TEMP/wheel-py313"
          if [ "$RUNNER_OS" = "Windows" ]; then
            source "$RUNNER_TEMP/wheel-py313/Scripts/activate"
          else
            source "$RUNNER_TEMP/wheel-py313/bin/activate"
          fi
          for wheel in dist/*.whl; do
            uv pip install --python "$VIRTUAL_ENV" "$wheel"
          done
          python -I scripts/smoke_install.py
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.name }}
          path: dist/*.whl
          if-no-files-found: error

  pypi:
    # Dispatch is a build-only rehearsal, including dispatch on a tag.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [verify, checks, wheels]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ndfiltrs/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: release-sdist
          path: dist
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.5"
      - name: Publish verified distributions
        run: >-
          uv publish --trusted-publishing always
          --check-url https://pypi.org/simple/ dist/*

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: release-sdist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: notes
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" dist/* --verify-tag
          --title "$RELEASE_TAG" --notes-file notes/release-notes.md
